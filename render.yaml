# render.yaml

services:
  - type: web
    name: skolify-ai
    env: python
    region: singapore
    plan: free

    # Playwright bilkul nahi - sirf pip install
    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CONV_STORAGE
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
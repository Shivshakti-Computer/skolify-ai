# render.yaml
# Root directory mein rakho

services:
  - type: web
    name: skolify-ai
    env: python
    region: singapore
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CONV_STORAGE
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false